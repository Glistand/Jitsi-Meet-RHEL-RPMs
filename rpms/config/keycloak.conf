# /etc/keycloak/keycloak.conf — шаблон для Jitsi OIDC (Keycloak 26.x)
# Замените meet.example.com, пароли БД и admin перед первым запуском.

db=postgres
db-url=jdbc:postgresql://127.0.0.1:5432/keycloak
db-username=keycloak
db-password=CHANGE_ME_DB

hostname=meet.example.com
http-relative-path=/
proxy=edge
http-enabled=true
http-port=8080

# Первый запуск (создание admin): задайте и выполните kc.sh bootstrap-admin-user
# или export KC_BOOTSTRAP_ADMIN_USERNAME / KC_BOOTSTRAP_ADMIN_PASSWORD перед start
