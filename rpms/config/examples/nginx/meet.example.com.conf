# /etc/nginx/conf.d/meet.example.com.conf
# Замените meet.example.com. TLS — certbot или свои сертификаты.

server {
    listen 80;
    listen [::]:80;
    server_name meet.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meet.example.com;

    ssl_certificate     /etc/letsencrypt/live/meet.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meet.example.com/privkey.pem;

    root /usr/share/jitsi-meet;
    index index.html;

    # Keycloak OIDC (опционально) — include config-examples/keycloak/nginx-realms.snippet

    # File sharing (опционально) — include config-examples/file-sharing/nginx.snippet

    location = /config.js {
        alias /etc/jitsi/meet/meet.example.com-config.js;
    }

    location = /external_api.js {
        alias /usr/share/jitsi-meet/libs/external_api.min.js;
    }

    location ~ ^/(libs|css|static|images|fonts|lang|sounds|connection_optimization) {
        add_header Access-Control-Allow-Origin *;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /http-bind {
        proxy_pass http://127.0.0.1:5280/http-bind;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /xmpp-websocket {
        proxy_pass http://127.0.0.1:5280/xmpp-websocket;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
