name: Build and release RPMs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - dist: el9
            image: rockylinux:9
          - dist: fc44
            image: fedora:44
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install build deps
        run: |
          set -eux
          if grep -qiE 'rocky|almalinux|centos|rhel' /etc/os-release 2>/dev/null; then
            dnf install -y epel-release
          fi
          dnf install -y rpm-build git java-21-openjdk-devel unzip curl tar gcc-c++ make python3
          curl -fsSL https://rpm.nodesource.com/setup_22.x | bash -
          dnf install -y nodejs

      - uses: actions/checkout@v4

      - name: Bootstrap JDK/Maven
        run: ./tools/bootstrap.sh

      - name: Clone upstream sources
        run: ./scripts/clone-sources.sh

      - name: Build components and RPMs
        run: PREBUILT=0 ./build-rpms.sh all
        env:
          TARGET_DIST: ${{ matrix.dist }}

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.dist }}
          path: build/rpms/noarch/*.rpm

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.rpm
          generate_release_notes: true
