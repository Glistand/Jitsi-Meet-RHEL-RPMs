name: Build and release RPMs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          set -eux
          dnf install -y --setopt=install_weak_deps=False --setopt=max_parallel_downloads=10 \
            rpm-build git java-21-openjdk-devel unzip curl tar gcc-c++ make python3 \
            nodejs npm

      - name: Bootstrap JDK/Maven
        run: ./tools/bootstrap.sh

      - name: Clone upstream sources
        run: ./scripts/clone-sources.sh

      - name: Build sources and RPMs (el9 + fc44)
        run: |
          set -eux
          # Сборка исходников один раз, затем два набора noarch RPM с разным dist
          PREBUILT=0 TARGET_DIST=el9 ./build-rpms.sh all
          PREBUILT=1 TARGET_DIST=fc44 ./build-rpms.sh rpm
          ls -lh build/rpms/noarch/*.rpm

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: build/rpms/noarch/*.rpm

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: rpms
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.rpm
          generate_release_notes: true
