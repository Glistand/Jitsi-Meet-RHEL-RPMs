name: Build and release RPMs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          set -eux
          dnf install -y --setopt=install_weak_deps=False --setopt=max_parallel_downloads=10 \
            rpm-build git unzip curl tar gcc-c++ make python3 nodejs npm

      - name: Bootstrap JDK/Maven
        run: ./tools/bootstrap.sh

      - name: Clone upstream sources
        run: ./scripts/clone-sources.sh

      - name: Build sources and RPMs (el9 + fc44)
        run: |
          set -eux
          PREBUILT=0 TARGET_DIST=el9 ./build-rpms.sh all
          PREBUILT=1 TARGET_DIST=fc44 ./build-rpms.sh rpm
          ls -lh build/rpms/noarch/*.rpm

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: build/rpms/noarch/*.rpm

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rpms
          path: build/rpms/noarch

      - name: Fetch prosody plugins
        run: |
          mkdir -p src
          git clone --depth 1 --branch stable/jitsi-meet_11146 \
            https://github.com/jitsi/jitsi-meet.git src/jitsi-meet

      - name: Build release bundle (offline repo)
        run: |
          chmod +x scripts/*.sh release/install-offline.sh
          ./scripts/make-release-bundle.sh "${GITHUB_REF_NAME}" build/rpms/noarch dist
          ls -lh dist/*.tar.gz
          tar -tzf dist/*.tar.gz | head -30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
          generate_release_notes: true
          body: |
            ## Состав архива `jitsi-meet-rhel-*.tar.gz`

            - **repo/el9/** — локальный DNF-репозиторий (Jitsi RPM + зависимости для офлайн-установки)
            - **rpms/el9/** — только пакеты Jitsi (для обновления)
            - **rpms/fc44/** — пакеты для Fedora 44 (noarch, совместимы по содержимому)
            - **prosody-plugins/** — Lua-модули Prosody из jitsi-meet
            - **config-examples/** — примеры Prosody, nginx, jicofo, JVB, Keycloak, file sharing, reservations
            - **INSTALL-RHEL.md** — пошаговая установка на RHEL
            - **install-offline.sh** — установка пакетов без интернета
            - **CHECKSUMS.sha256** — контрольные суммы RPM

            Распакуйте архив и следуйте `INSTALL-RHEL.md`.
